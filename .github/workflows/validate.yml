name: Validate repository

on:
  pull_request:
  push:
    branches: [main, 'release/readiness-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Validate skills and README catalog
        run: node scripts/validate-repository.mjs

      - name: Build static site
        run: node scripts/build-site.mjs

      - name: Test installer and executable examples
        run: node --test scripts/repository.test.mjs
