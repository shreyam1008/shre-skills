name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - skills/**
      - site/**
      - scripts/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Validate repository
        run: node scripts/validate-repository.mjs

      - name: Build site from skill frontmatter
        env:
          # GitHub reports an http:// Pages URL while the custom-domain
          # certificate is provisioning. The published canonical stays HTTPS.
          PAGES_BASE_URL: https://skills.shreyam1008.com.np
        run: node scripts/build-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
